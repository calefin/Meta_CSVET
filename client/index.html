<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>VetRank — +50.000 Questões para Residência e ENADE Veterinária</title>
    <meta name="description" content="Prepare-se para Residência Veterinária, ENARE e ENADE com +50.000 questões comentadas, simulados cronometrados e ranking. Acesse grátis e estude com inteligência." />
    <meta name="keywords" content="questões veterinária, simulado residência veterinária, ENARE veterinária, ENADE veterinária, banco questões medicina veterinária, preparatório residência vet, concurso veterinário, provas veterinária online, VetRank, estudo veterinária gamificado" />
    <meta name="author" content="VetRank" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.vetrank.com.br/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.vetrank.com.br/" />
    <meta property="og:site_name" content="VetRank" />
    <meta property="og:title" content="VetRank — +50.000 Questões para Residência e ENADE Veterinária" />
    <meta property="og:description" content="Banco com +50.000 questões comentadas, simulados cronometrados e ranking para Residência Veterinária, ENARE e ENADE. Comece grátis." />
    <meta property="og:image" content="https://www.vetrank.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vetrank" />
    <meta name="twitter:title" content="VetRank — +50.000 Questões para Residência e ENADE Veterinária" />
    <meta name="twitter:description" content="Simulados cronometrados, banco de questões comentadas e ranking para Residência Veterinária, ENARE e ENADE. Comece grátis." />
    <meta name="twitter:image" content="https://www.vetrank.com.br/og-image.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0d1117" />

    <!-- Structured Data — Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VetRank",
      "url": "https://www.vetrank.com.br",
      "logo": "https://www.vetrank.com.br/favicon.svg",
      "description": "Plataforma de preparação para Residência Veterinária, ENARE e ENADE com +50.000 questões comentadas, simulados cronometrados e gamificação.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contato@vetrank.com.br",
        "contactType": "customer support",
        "availableLanguage": "Portuguese"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data — WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VetRank",
      "url": "https://www.vetrank.com.br",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.vetrank.com.br/bank?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data — EducationalOrganization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "VetRank",
      "url": "https://www.vetrank.com.br",
      "description": "Plataforma gamificada de estudos para Medicina Veterinária com banco de +50.000 questões, simulados para ENARE, ENADE e Residência.",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Planos VetRank",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Plano Free",
            "price": "0",
            "priceCurrency": "BRL",
            "description": "Acesso gratuito ao banco de questões básico"
          },
          {
            "@type": "Offer",
            "name": "Plano Premium Anual",
            "price": "299",
            "priceCurrency": "BRL",
            "description": "Acesso completo a +50.000 questões, simulados ilimitados e ranking"
          }
        ]
      }
    }
    </script>

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA Manifest & Mobile Support -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VetRank" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
