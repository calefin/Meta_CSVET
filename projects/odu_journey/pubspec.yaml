name: odu_journey
description: "Odù Journey — Aprenda e pratique os 256 Odù de Ifá."
publish_to: 'none'

version: 1.0.3+13

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Dados e persistência
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  diacritic: ^0.1.3

  # UI
  flutter_svg: ^2.0.0
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8

  # Rede
  http: ^1.6.0
  url_launcher: ^6.3.2

  # Monetização
  purchases_flutter: ^10.0.1
  purchases_ui_flutter: ^10.0.1

  # Notificações
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/json/
    - assets/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5D4037"
  adaptive_icon_foreground: "assets/logo.png"
