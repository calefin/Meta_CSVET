services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestao
      DB_USERNAME: gestao
      DB_PASSWORD: gestao
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestao
      MYSQL_USER: gestao
      MYSQL_PASSWORD: gestao
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./docker/test-db-init.sql:/docker-entrypoint-initdb.d/00-users.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
