<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff" rx="12"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Organizando dados de peso de animais ao longo do tempo</text>

  <!-- LEFT: Wide / messy -->
  <g>
    <rect x="24" y="56" width="380" height="380" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="214" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">✕ Formato Largo (não arrumado)</text>

    <!-- table -->
    <g font-size="13">
      <rect x="48" y="104" width="332" height="32" fill="#fecaca"/>
      <text x="70" y="125" font-weight="700" fill="#7f1d1d">Animal</text>
      <text x="170" y="125" font-weight="700" fill="#7f1d1d">Jan</text>
      <text x="250" y="125" font-weight="700" fill="#7f1d1d">Fev</text>
      <text x="330" y="125" font-weight="700" fill="#7f1d1d">Mar</text>

      <rect x="48" y="136" width="332" height="30" fill="#ffffff"/>
      <text x="70" y="156" fill="#334155">Rex</text>
      <text x="170" y="156" fill="#334155">12.1</text>
      <text x="250" y="156" fill="#334155">12.4</text>
      <text x="330" y="156" fill="#334155">12.8</text>

      <rect x="48" y="166" width="332" height="30" fill="#fef2f2"/>
      <text x="70" y="186" fill="#334155">Mia</text>
      <text x="170" y="186" fill="#334155">4.0</text>
      <text x="250" y="186" fill="#334155">4.1</text>
      <text x="330" y="186" fill="#334155">4.3</text>

      <rect x="48" y="104" width="332" height="92" fill="none" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="145" y1="104" x2="145" y2="196" stroke="#ef4444" stroke-width="1"/>
      <line x1="225" y1="104" x2="225" y2="196" stroke="#ef4444" stroke-width="1"/>
      <line x1="305" y1="104" x2="305" y2="196" stroke="#ef4444" stroke-width="1"/>
    </g>

    <path d="M170 210 L330 210" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="214" y="234" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">"Jan/Fev/Mar" são valores de</text>
    <text x="214" y="250" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">uma variável, não 3 colunas</text>

    <text x="214" y="284" text-anchor="middle" font-size="12" fill="#7f1d1d">✕ Difícil de filtrar, agrupar</text>
    <text x="214" y="302" text-anchor="middle" font-size="12" fill="#7f1d1d">   e calcular por mês</text>

    <text x="214" y="340" text-anchor="middle" font-size="34">📋</text>
    <text x="214" y="368" text-anchor="middle" font-size="11" fill="#991b1b">bom para leitura visual rápida,</text>
    <text x="214" y="384" text-anchor="middle" font-size="11" fill="#991b1b">ruim para análise estatística</text>
  </g>

  <!-- Arrow center -->
  <g>
    <path d="M414 246 L486 246" stroke="#0d9488" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <text x="450" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">reorganizar</text>
  </g>

  <!-- RIGHT: Long / tidy -->
  <g>
    <rect x="496" y="56" width="380" height="380" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="686" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">✓ Formato Longo (tidy data)</text>

    <g font-size="12.5">
      <rect x="520" y="102" width="332" height="26" fill="#99f6e4"/>
      <text x="534" y="120" font-weight="700" fill="#134e4a">animal</text>
      <text x="634" y="120" font-weight="700" fill="#134e4a">mes</text>
      <text x="724" y="120" font-weight="700" fill="#134e4a">peso_kg</text>

      <!-- 6 rows -->
      <rect x="520" y="128" width="332" height="24" fill="#ffffff"/>
      <text x="534" y="145" fill="#334155">Rex</text><text x="634" y="145" fill="#334155">Jan</text><text x="724" y="145" fill="#334155">12.1</text>

      <rect x="520" y="152" width="332" height="24" fill="#f0fdfa"/>
      <text x="534" y="169" fill="#334155">Rex</text><text x="634" y="169" fill="#334155">Fev</text><text x="724" y="169" fill="#334155">12.4</text>

      <rect x="520" y="176" width="332" height="24" fill="#ffffff"/>
      <text x="534" y="193" fill="#334155">Rex</text><text x="634" y="193" fill="#334155">Mar</text><text x="724" y="193" fill="#334155">12.8</text>

      <rect x="520" y="200" width="332" height="24" fill="#f0fdfa"/>
      <text x="534" y="217" fill="#334155">Mia</text><text x="634" y="217" fill="#334155">Jan</text><text x="724" y="217" fill="#334155">4.0</text>

      <rect x="520" y="224" width="332" height="24" fill="#ffffff"/>
      <text x="534" y="241" fill="#334155">Mia</text><text x="634" y="241" fill="#334155">Fev</text><text x="724" y="241" fill="#334155">4.1</text>

      <rect x="520" y="248" width="332" height="24" fill="#f0fdfa"/>
      <text x="534" y="265" fill="#334155">Mia</text><text x="634" y="265" fill="#334155">Mar</text><text x="724" y="265" fill="#334155">4.3</text>

      <rect x="520" y="102" width="332" height="170" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
      <line x1="610" y1="102" x2="610" y2="272" stroke="#14b8a6" stroke-width="1"/>
      <line x1="700" y1="102" x2="700" y2="272" stroke="#14b8a6" stroke-width="1"/>
    </g>

    <text x="686" y="300" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="600">3 variáveis · 6 observações</text>

    <text x="686" y="326" text-anchor="middle" font-size="12" fill="#134e4a">✓ Fácil de filtrar, agrupar</text>
    <text x="686" y="344" text-anchor="middle" font-size="12" fill="#134e4a">   e calcular por mês/animal</text>

    <text x="686" y="382" text-anchor="middle" font-size="34">📊</text>
    <text x="686" y="410" text-anchor="middle" font-size="11" fill="#115e59">o formato que R, Python e</text>
    <text x="686" y="426" text-anchor="middle" font-size="11" fill="#115e59">qualquer software estatístico esperam</text>
  </g>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0d9488"/>
    </marker>
  </defs>
</svg>
