<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VetRank — WhatsApp 800×800</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 800px; height: 800px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .card {
    width: 800px; height: 800px;
    background: linear-gradient(150deg, #060e09 0%, #0a1a10 55%, #060e09 100%);
    position: relative; overflow: hidden;
    padding: 52px 56px 48px;
    display: flex; flex-direction: column;
  }

  .glow-tr { position: absolute; top: -120px; right: -120px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(16,185,129,0.22) 0%, transparent 65%); pointer-events: none; }
  .glow-bl { position: absolute; bottom: -100px; left: -80px; width: 420px; height: 420px; background: radial-gradient(circle, rgba(245,158,11,0.10) 0%, transparent 65%); pointer-events: none; }

  .dots { position: absolute; top: 44px; right: 52px; display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
  .dot { width: 5px; height: 5px; background: #0d3322; border-radius: 50%; }

  .logo { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .logo svg { width: 48px; height: 48px; }
  .logo-name { font-size: 36px; font-weight: 900; letter-spacing: -0.8px; }
  .logo-name .vet { font-family: Georgia, serif; color: #fff; }
  .logo-name .rank { color: #10b981; }

  .divider { height: 1px; background: #0d3322; margin: 18px 0; }

  .headline { font-size: 56px; font-weight: 900; color: #f8fafc; line-height: 1.08; letter-spacing: -2px; margin-bottom: 14px; position: relative; z-index: 1; }
  .headline span { background: linear-gradient(90deg, #10b981 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .tags { display: flex; gap: 8px; margin-bottom: 6px; position: relative; z-index: 1; flex-wrap: wrap; }
  .tag { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 100px; padding: 4px 14px; font-size: 13px; font-weight: 600; color: #6ee7b7; }

  .features { flex: 1; display: flex; flex-direction: column; gap: 13px; position: relative; z-index: 1; }
  .feature { display: flex; align-items: center; gap: 12px; }
  .check { width: 30px; height: 30px; background: rgba(6,78,59,0.9); border: 1px solid rgba(16,185,129,0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .feature-text { font-size: 20px; font-weight: 500; color: #e2e8f0; }

  .bottom { display: flex; align-items: center; gap: 20px; position: relative; z-index: 1; }
  .cta { background: linear-gradient(90deg, #10b981 0%, #34d399 100%); color: #052e16; font-size: 19px; font-weight: 900; padding: 15px 32px; border-radius: 12px; white-space: nowrap; }
  .website { font-size: 16px; color: #475569; margin-left: auto; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="glow-tr"></div><div class="glow-bl"></div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <div class="logo">
    <svg viewBox="30 18 100 128" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#047857"/></linearGradient></defs>
      <g transform="translate(30,15)">
        <path d="M20,45 L80,45 L80,85 C80,108 50,125 50,125 C50,125 20,108 20,85 Z" fill="#0F172A"/>
        <path d="M26,51 L74,51 L74,83 C74,101 50,114 50,114 C50,114 26,101 26,83 Z" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5"/>
        <path d="M43,62 h14 v10 h10 v14 h-10 v10 h-14 v-10 h-10 v-14 h10 z" fill="#10B981"/>
        <polygon points="50,10 95,27 50,44 5,27" fill="url(#g3)"/>
        <polygon points="50,16 85,27 50,38 15,27" fill="#064E3B" opacity="0.3"/>
        <path d="M50,27 L92,40 L92,60" fill="none" stroke="#F59E0B" stroke-width="2"/>
        <circle cx="92" cy="63" r="3.5" fill="#F59E0B"/>
      </g>
    </svg>
    <span class="logo-name"><span class="vet">Vet</span><span class="rank">Rank</span></span>
  </div>

  <div class="divider"></div>
  <div class="headline">Sua aprovação<br>começa <span>aqui.</span></div>
  <div class="tags">
    <span class="tag">CFMV</span>
    <span class="tag">Residência</span>
    <span class="tag">ENARE</span>
    <span class="tag">Aprimoramento</span>
  </div>
  <div class="divider"></div>

  <div class="features">
    <div class="feature">
      <div class="check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7L5.5 10.5L12 3" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="feature-text">+9.000 questões por banca e disciplina</span>
    </div>
    <div class="feature">
      <div class="check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7L5.5 10.5L12 3" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="feature-text">Simulados cronometrados com gabarito</span>
    </div>
    <div class="feature">
      <div class="check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7L5.5 10.5L12 3" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="feature-text">Trilhas semanais por edital</span>
    </div>
    <div class="feature">
      <div class="check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7L5.5 10.5L12 3" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="feature-text">Dashboard de desempenho por disciplina</span>
    </div>
    <div class="feature">
      <div class="check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7L5.5 10.5L12 3" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="feature-text">XP, ranking semanal e missões diárias</span>
    </div>
  </div>

  <div class="divider"></div>
  <div class="bottom">
    <div class="cta">Trial grátis — 7 dias</div>
    <span class="website">vetrank.com.br</span>
  </div>
</div>
</body>
</html>
