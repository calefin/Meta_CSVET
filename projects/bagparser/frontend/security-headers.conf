# Security headers (D-54). Included in every location of nginx.conf because an add_header inside a location
# drops the ones defined at server level.
#
# CSP sources:
#   img     static.tibia.com (creatures/items), static.wikia.nocookie.net (item fallback), i.ytimg.com (video thumbs)
#   frame   tibiamaps.io (hunting place map), youtube-nocookie.com (videos), challenges.cloudflare.com (Turnstile)
#   script  challenges.cloudflare.com (Turnstile on login/register)
#   connect the service worker fetches (and caches) the CipSoft / TibiaWiki images itself
#   ads     D-66: Google AdSense (free plan only, loaded only when ADSENSE_* is set): Google's own ad domains
# Stripe Checkout and Google/Discord login are full-page redirects, not covered by CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://www.googletagservices.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.tibia.com https://static.wikia.nocookie.net https://i.ytimg.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.gstatic.com https://*.adtrafficquality.google; font-src 'self' data:; connect-src 'self' https://static.tibia.com https://static.wikia.nocookie.net https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com https://*.googlesyndication.com https://*.doubleclick.net https://www.google.com https://*.adtrafficquality.google https://fundingchoicesmessages.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
