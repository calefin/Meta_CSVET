events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # IP real do visitante: quem conecta aqui é sempre o NPM (rede interna do Docker). Sem isto o
    # $binary_remote_addr abaixo era o IP do NPM e TODOS os usuários dividiam um único limite.
    # Só confia no X-Forwarded-For vindo das redes internas do Docker (172.16.0.0/12).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting (NPM já faz a camada externa, esta é interna)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # DNS interno do Docker + "resolve": o nginx re-resolve backend/frontend sozinho. Sem isto ele
    # guardava o IP da subida e, ao recriar um desses containers, o site dava 502 até reiniciar o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:80 resolve;
    }

    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            client_max_body_size 10M;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
