server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Security headers (D-54): repeated in every location, see security-headers.conf
    include /etc/nginx/snippets/security-headers.conf;

    # API traffic stays inside the Docker network (the API sets its own headers; CSP is for HTML pages)
    # Docker DNS + variável: o nginx re-resolve "api" a cada 10s. Com o nome fixo no proxy_pass ele
    # guardava o IP da subida e, se o container api fosse recriado com outro IP, a API dava 502 até
    # reiniciar o web. Sem URI na variável, o caminho original segue igual ao de antes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:3000;

    # D-66: ads.txt for Google AdSense, generated by the API from ADSENSE_CLIENT (404 while ads are off)
    location = /ads.txt {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$api_upstream/api/ads.txt;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Keep the client chain from the host reverse proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # PWA: the service worker, manifest and HTML must always be revalidated
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # Item image index (D-35)
    location /sprites/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Share cards and bundled boss sprites change rarely
    location ~ ^/(og|bosses|map)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Per-route HTML from scripts/seo.mjs (D-36), then the SPA fallback; HTML is always revalidated
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
