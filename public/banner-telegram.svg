<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4d38"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c97a"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="640" height="360" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Decorative adire circles background -->
  <circle cx="580" cy="60"  r="120" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="580" cy="60"  r="90"  fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="60"  cy="300" r="100" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
  <circle cx="60"  cy="300" r="70"  fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Thin gold top border -->
  <rect x="0" y="0" width="640" height="4" fill="url(#gold)" opacity="0.9"/>
  <!-- Thin gold bottom border -->
  <rect x="0" y="356" width="640" height="4" fill="url(#gold)" opacity="0.9"/>

  <!-- Logo (centered left column) -->
  <g transform="translate(60, 80) scale(0.39)">
    <circle cx="256" cy="256" r="248" fill="#FFFFFF" fill-opacity="0.97"/>
    <circle cx="256" cy="256" r="232" fill="none" stroke="#7B4F2E" stroke-width="3" stroke-dasharray="2 10"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="#7B4F2E" stroke-width="6"/>
    <polygon points="416,256 369.1,369.1 256,416 142.9,369.1 96,256 142.9,142.9 256,96 369.1,142.9"
      fill="none" stroke="#2D6A4F" stroke-width="5"/>
    <circle cx="416"   cy="256"   r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="369.1" cy="369.1" r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="256"   cy="416"   r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="142.9" cy="369.1" r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="96"    cy="256"   r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="142.9" cy="142.9" r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="256"   cy="96"    r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="369.1" cy="142.9" r="26" fill="#7B4F2E" stroke="#2D6A4F" stroke-width="4"/>
    <circle cx="256" cy="256" r="54" fill="#2D6A4F"/>
    <circle cx="256" cy="256" r="54" fill="none" stroke="#7B4F2E" stroke-width="4"/>
  </g>

  <!-- Vertical gold divider -->
  <rect x="265" y="48" width="1.5" height="264" fill="url(#gold)" opacity="0.5"/>

  <!-- Right column text -->
  <!-- Organization name -->
  <text x="295" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#FAF7F0" letter-spacing="0.5">Ìjọ Ifá Èjìogbè</text>

  <!-- Gold underline -->
  <rect x="295" y="120" width="310" height="1.5" fill="url(#gold)" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="295" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#FAF7F0" opacity="0.75" letter-spacing="2" font-style="italic">Tradição Yorùbá · São Paulo · Brasil</text>

  <!-- Description lines -->
  <text x="295" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FAF7F0" opacity="0.9">Consultas Oraculares de Ifá</text>
  <text x="295" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FAF7F0" opacity="0.9">Cursos, Cerimônias e Acompanhamento Espiritual</text>

  <!-- Telegram pill -->
  <rect x="295" y="238" width="218" height="38" rx="19" fill="#229ED9" opacity="0.95"/>
  <!-- Telegram icon inside pill -->
  <g transform="translate(312, 250) scale(0.75)">
    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.96 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" fill="white"/>
  </g>
  <text x="339" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">@ijoifa_bot</text>

  <!-- Website pill -->
  <rect x="523" y="238" width="90" height="38" rx="19" fill="#FAF7F0" opacity="0.12"/>
  <text x="568" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FAF7F0" text-anchor="middle">ijoifa.com</text>

  <!-- Bottom tagline -->
  <text x="295" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#e8c97a" opacity="0.85" font-style="italic">Àṣà · Ìmọ̀ · Ìwà Pẹ̀lẹ́</text>
</svg>
