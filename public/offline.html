<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Conexão — profatilio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #cbd5e1;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            text-align: center;
            max-width: 380px;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        button {
            background: #0d9488;
            color: #fff;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0f766e; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Você está offline</h1>
        <p>Verifique sua conexão com a internet e tente novamente. Algumas páginas visitadas anteriormente podem estar disponíveis em cache.</p>
        <button onclick="window.location.reload()">Tentar Novamente</button>
    </div>
</body>
</html>
